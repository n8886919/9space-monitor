name: 9Space Notification Log
version: "0.1.0"
slug: 9space_notification_log
description: >-
  Receives Android notification events from Tasker over an authenticated HTTP
  API and stores them in a bounded SQLite database.
arch:
  - amd64
  - aarch64
  - armv7
startup: services
boot: auto
init: false

ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Tasker notification ingestion API

options:
  auth_token: ""
  retention_days: 30
  max_rows: 100000

schema:
  auth_token: password
  retention_days: int
  max_rows: int
