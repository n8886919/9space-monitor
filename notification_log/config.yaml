name: 9Space Notification Log
version: "0.3.0"
slug: 9space_notification_log
description: >-
  Stores Pikmin Bloom mushroom invite events and reports inviter counts and
  latest invite times through a Home Assistant internal API.
arch:
  - amd64
  - aarch64
  - armv7
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:mushroom
panel_title: Pikmin 蘑菇邀請
panel_admin: true

ports:
  8099/tcp: null
ports_description:
  8099/tcp: Internal notification ingestion API (host mapping disabled)

options:
  retention_days: 30
  max_rows: 100000

schema:
  retention_days: int
  max_rows: int
