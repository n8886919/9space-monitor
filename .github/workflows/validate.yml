name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate Python and repository metadata
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/nvr_monitor
          python -m unittest discover -s tests -v

  hassfest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
