services:
  center:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      CENTER_DATABASE_PATH: /data/telemetry.sqlite3
    ports:
      - "${CENTER_BIND_ADDRESS:-127.0.0.1}:8765:8765"
    volumes:
      - center-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  center-data:
