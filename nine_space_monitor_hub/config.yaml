name: 9Space Monitor Hub
version: "0.3.2"
slug: 9space_monitor_hub
description: >-
  Central snapshot hub for 9Space sites. Keeps one last-good JPEG per camera;
  current status stays in memory and Home Assistant Recorder owns history.
arch:
  - amd64
  - aarch64
  - armv7
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8765
panel_icon: mdi:cctv
panel_title: 9Space Monitor Hub
ports:
  8765/tcp: 8765
options:
  max_stale_seconds: 120
  snapshot_store_limit_mb: 1024
  snapshot_refresh_seconds: 30
schema:
  max_stale_seconds: int
  snapshot_store_limit_mb: int
  snapshot_refresh_seconds: int
